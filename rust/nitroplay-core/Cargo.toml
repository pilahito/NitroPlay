[package]
name = "nitroplay-core"
version = "0.1.0"
edition = "2021"
description = "Marco de NitroPlay: descubrimiento, PIN/registro y sesion de juego remoto (sin dependencias)"

[features]
# Registro y sesion reales con libchiaki (necesita CHIAKI_BUILD_DIR, ver chiaki-sys).
chiaki = ["dep:chiaki-sys"]

[dependencies]
chiaki-sys = { path = "../chiaki-sys", optional = true }
