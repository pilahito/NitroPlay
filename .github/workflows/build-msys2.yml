name: Build NitroPlay for Windows x64

on:
  push:
    branches: [main, 'windows/**']
    paths:
      - '.github/workflows/build-msys2.yml'
      - 'scripts/nitroplay-windows.iss'
      - 'scripts/deploy-windows-msys2.sh'
  workflow_dispatch:
    inputs:
      libplacebo_version:
        description: "libplacebo git tag to build"
        required: false
        default: "3be579e6c7f6b421d9ac3ab4860edc437c50b3eb"

permissions:
  contents: read

concurrency:
  group: nitroplay-windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows_x64-msys2:
    name: Build and package NitroPlay
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Disable autocrlf
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: git diffutils
          pacboy: >-
            ca-certificates:p
            cc:p
            cmake:p
            curl:p
            fast_float:p
            fftw:p
            json-c:p
            libevent:p
            lcms2:p
            libdovi:p
            meson:p
            miniupnpc:p
            gcc:p
            nasm:p
            ninja:p
            openssl:p
            opus:p
            pkgconf:p
            protobuf:p
            python:p
            python-psutil:p
            python-glad:p
            python-jinja:p
            python-pip:p
            qt6-base:p
            qt6-declarative:p
            qt6-svg:p
            qt6-tools:p
            shaderc:p
            speexdsp:p
            spirv-cross:p
            vulkan:p
            vulkan-headers:p
            
      - name: Install python protobuf and zip
        run: |
          pip install protobuf
          pacman -S git make unzip zip --noconfirm

      - name: Build libplacebo
        run: |
          scripts/build-libplacebo-windows.sh
        env:
          LIBPLACEBO_VERSION: ${{ inputs.libplacebo_version || '3be579e6c7f6b421d9ac3ab4860edc437c50b3eb' }}

      - name: Setup ffmpeg
        run: |
          curl --fail --location --retry 3 --remote-name https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip
          unzip ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip
          cp -a "ffmpeg-n9.0-latest-win64-gpl-shared-9.0/bin/." /mingw64/bin
          cp -a "ffmpeg-n9.0-latest-win64-gpl-shared-9.0/include/." /mingw64/include
          cp -a "ffmpeg-n9.0-latest-win64-gpl-shared-9.0/lib/." /mingw64/lib

      - name: Build sdl2-compat
        run: |
          INSTALL_PREFIX=/mingw64 scripts/build-sdl2-compat.sh .
          INSTALL_PREFIX=/mingw64 scripts/build-hidapi.sh .
          cp /mingw64/lib/pkgconfig/sdl2-compat.pc /mingw64/lib/pkgconfig/sdl2.pc

      - name: Configure NitroPlay
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCHIAKI_ENABLE_CLI=OFF

      - name: Build NitroPlay
        run: |
          cmake --build build --config Release --clean-first --target chiaki
          
      - name: Deploy NitroPlay
        run: |
          ./scripts/deploy-windows-msys2.sh NitroPlay-Windows build/gui/chiaki.exe "$PWD/build/third-party/cpp-steam-tools" /mingw64 gui/src/qml
          cp COPYING NitroPlay-Windows/
          cp -r LICENSES NitroPlay-Windows/
          test -f NitroPlay-Windows/chiaki.exe
          test -f NitroPlay-Windows/platforms/qwindows.dll

      - name: Package portable ZIP
        run: |
          zip -qr NitroPlay-Windows-x64-portable.zip NitroPlay-Windows
          unzip -tq NitroPlay-Windows-x64-portable.zip

      - name: Compile Windows installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: scripts/nitroplay-windows.iss
          options: /O+

      - name: Upload portable build
        uses: actions/upload-artifact@v7
        with:
          name: NitroPlay-Windows-x64-portable
          path: NitroPlay-Windows-x64-portable.zip
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: NitroPlay-Windows-x64-installer
          path: NitroPlay-Windows-x64-setup.exe
          if-no-files-found: error
